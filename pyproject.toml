[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lam"
version = "0.1.0"
description = "Living Artificial Mind"
authors = [{name = "LAM Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8",
    "requests>=2.32",
    "openai>=1.14",
    "opentelemetry-api>=1.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
    "semgrep",
    "autopep8",
    "black",
    "ruff",
    "mypy",
]
tests = [
    "opentelemetry-sdk>=1.22",
]
vector = [
    "faiss-cpu>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
lam = "src.lam_cli:main"

[tool.lam]
memory_path = "memory"

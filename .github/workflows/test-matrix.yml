name: Test Matrix
on:
  workflow_dispatch:
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Trigger tests
        run: tma trigger --matrix ${{ matrix.python }}
      - name: Show metrics
        run: tma status

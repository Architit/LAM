name: Test Matrix

on:
  workflow_dispatch:
  pull_request:

jobs:
  matrix:
    strategy:
      matrix:
        python: ["3.12"]
    uses: ./.github/workflows/submodule-gate.yml
    with:
      python_version: ${{ matrix.python }}
      submodule_paths: |
        LAM/default/agents/comm-agent
        LAM/default/agents/codex-agent
        LAM/default/agents/roaudter-agent
        LAM/default/agents/operator-agent
        LAM/default/agents/test-agent
      test_command: ./devkit/check.sh --profile ci
    secrets: inherit

name: Test Matrix
on:
  workflow_dispatch:
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e . -r requirements-dev.txt
      - name: Run tests
        run: |
          ./devkit/check.sh --profile ci

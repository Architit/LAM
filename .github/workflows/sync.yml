name: Sync Data from LAM_DATA_Src

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize submodule
        run: |
          git submodule update --init --recursive

      - name: Update data-src submodule
        run: |
          git submodule update --remote LAM/default/agents/data-src

      - name: Commit and push changes
        run: |
          git add LAM/default/agents/data-src
          git commit -m "Auto-update data-src from LAM_DATA_Src" || echo "No changes to commit"
          git push origin main

name: Sync Data from LAM_DATA_Src

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LAM_SUBMODULE_ACCESS_TOKEN || secrets.LAM_Submodule_Acces || github.token }}
      - name: Configure GitHub auth for submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.LAM_SUBMODULE_ACCESS_TOKEN || secrets.LAM_Submodule_Acces || github.token }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Initialize submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive LAM/default/agents/data-src

      - name: Update data-src submodule
        run: |
          git submodule update --remote LAM/default/agents/data-src

      - name: Commit and push changes
        run: |
          git add LAM/default/agents/data-src
          git commit -m "Auto-update data-src from LAM_DATA_Src" || echo "No changes to commit"
          git push origin main

name: CI

on:
  push:
  pull_request:

jobs:
  lam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LAM_SUBMODULE_ACCESS_TOKEN || secrets.LAM_Submodule_Acces || github.token }}

      - name: Init required submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive \
            LAM/default/agents/comm-agent \
            LAM/default/agents/codex-agent \
            LAM/default/agents/roaudter-agent

      - name: Verify required submodules
        run: |
          git submodule status LAM/default/agents/comm-agent
          git submodule status LAM/default/agents/codex-agent
          git submodule status LAM/default/agents/roaudter-agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bootstrap venv + deps
        run: |
          ./devkit/bootstrap.sh

      - name: CI Gate via devkit/check.sh
        env:
          TMPDIR: /tmp
          TEMP: /tmp
          TMP: /tmp
        run: |
          ./devkit/check.sh --profile ci

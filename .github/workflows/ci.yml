name: CI

on:
  push:
  pull_request:

jobs:
  lam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LAM_SUBMODULE_ACCESS_TOKEN != "" && secrets.LAM_SUBMODULE_ACCESS_TOKEN || secrets.LAM_Submodule_Acces != "" && secrets.LAM_Submodule_Acces || github.token }}

      - name: Verify submodule checkout
        run: git submodule status --recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bootstrap venv + deps
        run: |
          ./devkit/bootstrap.sh

      - name: CI Gate via devkit/check.sh
        env:
          TMPDIR: /tmp
          TEMP: /tmp
          TMP: /tmp
        run: |
          ./devkit/check.sh --profile ci

name: CI

on:
  push:
  pull_request:

jobs:
  lam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Fetch DevKit
        run: |
          git clone --depth 1 https://github.com/Architit/RADRILONIUMA-PROJECT.git /tmp/radriloniuma-project

      - name: Bootstrap venv + deps
        run: |
          /tmp/radriloniuma-project/devkit/bootstrap.sh "$GITHUB_WORKSPACE"

      - name: Run tests (sanity)
        env:
          TMPDIR: /tmp
          TEMP: /tmp
          TMP: /tmp
        run: |
          /tmp/radriloniuma-project/devkit/check.sh "$GITHUB_WORKSPACE" \
            tests/test_envelope_standard.py \
            tests/test_taskarid_comm_roaudter_trace.py \
            tests/test_comm_agent_envelope_enforcement.py
